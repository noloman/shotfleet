# Experiment E1 (docs/linux.md): the Android fixture on a Linux runner with KVM. One-off, approved by Manu 2026-10-03
# (CI is otherwise not used for shotfleet). Runs only on pushes to this branch that touch this file, or by hand.
name: e1-android-kvm
on:
  push:
    branches: [claude/e1-android-kvm]
    paths: [.github/workflows/e1-android-kvm.yml]
  workflow_dispatch:
jobs:
  e1:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        run: |
          uname -srm; nproc; free -m; df -h /; ls -l /dev/kvm || true; grep -Ec '(vmx|svm)' /proc/cpuinfo || true
          grep -m1 'model name' /proc/cpuinfo
      - name: Let the runner user use /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-deu tesseract-ocr-jpn tesseract-ocr-ara tesseract-ocr-tur aapt unzip
      - name: doctor --fix
        run: python3 shotfleet.py doctor --fix --yes 2>&1 | tee doctor.log
      - name: SDK state
        if: always()
        continue-on-error: true
        shell: bash {0}
        run: |
          T=$ANDROID_HOME/cmdline-tools/latest/bin
          echo no | $T/avdmanager --verbose create avd -n dbg -k 'system-images;android-36;google_apis;x86_64' -d pixel_5 >dbg.out 2>dbg.err; echo "exit $?"
          echo "--- stdout"; grep -v '^\[' dbg.out; echo "--- stderr"; grep -v '^\[' dbg.err | head -30
          ls -la ~/.android ~/.android/avd
          find / -name 'dbg.*' -path '*avd*' -not -path '/proc/*' 2>/dev/null | head
          env | grep -iE 'ANDROID|XDG|^HOME' | sort
          $T/avdmanager list avd | head -20
      - name: Fixture e2e (android)
        run: |
          set -o pipefail
          export ANDROID_HOME=${ANDROID_HOME:-$HOME/Android/Sdk}
          SHOTFLEET_E2E=1 tools/fixture-e2e.sh --platform-only android --keep 2>&1 | tee e2e.log
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1-logs
          path: |
            doctor.log
            e2e.log
            /tmp/shotfleet-e2e*/**/*.log
          if-no-files-found: warn
