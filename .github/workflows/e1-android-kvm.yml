name: e1-android-kvm
# Experiment E1 (docs/linux.md): the Android fixture on a Linux machine with KVM, on a GitHub-hosted runner. MANUAL ONLY ("Run workflow"): this repo's rule is
# local checks and no scheduled or automatic Actions; the owner allowed this experiment once on 2026-10-03 (five runs, result in docs/linux.md, "E1 result").
# Hosted runners have 2 vCPU, 7 GB and only about 7 GB of free disk; the emulator needs 12 GB free, hence the clean-up step. The kept artifact holds the
# logs, the emulator logs and the run's out/ folder (screenshots and Maestro's debug output) for diagnosing a failure.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SHOTFLEET_E2E: "1"

jobs:
  e1:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Our own SDK folder, with a clean path (Google's Android CLI rejects ".." in it)
        run: |
          echo "ANDROID_HOME=$HOME/Android/Sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/Android/Sdk" >> "$GITHUB_ENV"

      - name: Free disk space (the emulator wants 12 GB free for its data partition; the runner starts with about 7 GB)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      - name: Machine and KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          echo "--- /dev/kvm";            ls -l /dev/kvm || echo "NO /dev/kvm"
          echo "--- vmx/svm cpu flags:";  grep -Ec '(vmx|svm)' /proc/cpuinfo || true
          echo "--- cpu";                 awk -F': ' '/^model name/{print $2; exit}' /proc/cpuinfo; nproc
          echo "--- memory and disk";     free -m; df -h / /tmp | cat
          {
            echo "### Machine"
            echo "- $(uname -srm); $(nproc) cores; $(awk '/^MemTotal:/{printf "%d MB", $2/1024}' /proc/meminfo) memory; $(awk '/^MemAvailable:/{printf "%d MB", $2/1024}' /proc/meminfo) available"
            echo "- cpu: $(awk -F': ' '/^model name/{print $2; exit}' /proc/cpuinfo)"
            echo "- /dev/kvm: $([ -w /dev/kvm ] && echo usable || echo 'MISSING or not writable')"
          } >> "$GITHUB_STEP_SUMMARY"
          [ -w /dev/kvm ] || { echo "no usable /dev/kvm on this runner: the emulator cannot run here (see the summary)"; exit 1; }

      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-java@v4          # a JDK (javac, keytool) builds the fixture app
        with: { distribution: temurin, java-version: "21" }

      - name: Tesseract with the four fixture languages
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-deu tesseract-ocr-jpn tesseract-ocr-ara tesseract-ocr-tur unzip

      - name: shotfleet doctor --fix (Maestro, Android tools, x86_64 system image)
        run: |
          mkdir -p "$ANDROID_HOME"
          python3 shotfleet.py doctor --fix --yes 2>&1 | tee doctor-fix.log
          python3 shotfleet.py doctor 2>&1 | tee doctor.log || true

      - name: Build tools and platform for the fixture app (idempotent)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" "build-tools;36.0.0" "platforms;android-36" 2>&1 | tail -5
          ls "$ANDROID_HOME" "$ANDROID_HOME/system-images/android-36/google_apis" 2>&1 | head -20

      - name: Emulator acceleration check
        run: |
          "$ANDROID_HOME/emulator/emulator" -accel-check 2>&1 | tee accel-check.log || true

      - name: Android fixture end to end
        run: |
          set -o pipefail
          tools/fixture-e2e.sh --platform-only android --keep 2>&1 | tee e2e.log
          rc=$?
          {
            echo "### Fixture e2e"
            grep -E '^(machine|cpu):|PASS|FAIL|phase|took|seconds|[0-9]+ s\b' e2e.log | sed 's/^/- /' | head -60
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Emulator logs (shown here and kept)
        if: always()
        run: |
          mkdir -p artifact/emulator-logs
          for f in /tmp/shotfleet-emulator-logs/*.log; do
            [ -f "$f" ] || continue
            echo "=============== $f ($(wc -l < "$f") lines)"; tail -60 "$f"; cp "$f" artifact/emulator-logs/
          done
          echo "--- processes"; ps aux | grep -E "emulator|qemu" | grep -v grep | cut -c1-200 || true
          echo "--- memory"; free -m

      - name: Collect the kept work folder
        if: always()
        run: |
          mkdir -p artifact
          cp -f *.log artifact/ 2>/dev/null || true
          for d in /tmp/shotfleet-e2e.*; do [ -d "$d" ] && cp -R "$d/logs" artifact/logs 2>/dev/null; done || true
          for d in /tmp/shotfleet-e2e.*; do [ -d "$d/fastlane-android" ] && cp -R "$d/fastlane-android" artifact/fastlane-android 2>/dev/null; done || true
          for d in /tmp/shotfleet-e2e.*; do [ -d "$d/proj-android/out" ] && cp -R "$d/proj-android/out" artifact/out 2>/dev/null; done || true   # screenshots and Maestro's debug output
          ls -R artifact | head -80

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e1-android-kvm
          path: artifact/
          retention-days: 14
