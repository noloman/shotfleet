appId: me.manulorenzo.crossfittracker.android.debug
name: "Android Store Screenshots"
---
- launchApp
- waitForAnimationToEnd:
    timeout: 5000

# ── Onboarding (Android): welcome, timers, experience, first action ──
# the disclaimer can appear late on a busy machine: dismiss it until onboarding shows
- repeat:
    while:
      notVisible: "Welcome to WOD Tracker"
    times: 15
    commands:
      - tapOn:
          text: "I Understand"
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
- assertVisible: "Welcome to WOD Tracker"
- tapOn: "Next"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Next"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Your Experience Level"
# longer languages push Next below the fold; "below" again because of Turkish (see next step)
- scrollUntilVisible:
    element:
      text: "Next"
      below:
        text: "3+ years of consistent training"
    direction: DOWN
# "below" pins the Next button: in Turkish "Next" and the "Advanced" option are the same word (İleri)
- tapOn:
    text: "Next"
    below:
      text: "3+ years of consistent training"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Pick your first step"
- tapOn: "I'll explore on my own"
- waitForAnimationToEnd:
    timeout: 3000

# ── Main app screens: one per tab ─────────────────
- takeScreenshot: 01_train
- tapOn: "Log"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02_log
- tapOn: "Progress"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03_progress
- tapOn: "Profile"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04_profile
