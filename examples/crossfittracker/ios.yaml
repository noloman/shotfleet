appId: me.manulorenzo.crossfittracker
name: "iOS Store Screenshots"
---

# ── Wait for app to load ──────────────────────────
- waitForAnimationToEnd:
    timeout: 3000
- waitForAnimationToEnd:
    timeout: 3000
- waitForAnimationToEnd:
    timeout: 3000

# the disclaimer can appear late on a busy machine: dismiss it until onboarding shows
- repeat:
    while:
      notVisible: "Your Training. Your Data."
    times: 15
    commands:
      - tapOn:
          text: "I Understand"
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000

# ── Onboarding (7 pages, redesigned in 1.5.x) ─────
# 3 intro pages, Experience Level, Training Goals, Equipment: defaults are fine, so Next through them
- assertVisible: "Your Training. Your Data."
- tapOn: "Next"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Next"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Next"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Experience Level"
# "below" pins the Next button: in Turkish "Next" and the "Advanced" option are the same word (İleri)
- tapOn:
    text: "Next"
    below:
      text: "3+ years of dedicated training"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Training Goals"
- tapOn: "Next"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Available Equipment"
- tapOn: "Next"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "You're All Set!"
- tapOn: "Start Training"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "One quick win before you start"
- tapOn: "I'll explore on my own"
- waitForAnimationToEnd:
    timeout: 3000

# ── Main app screens: one per tab ─────────────────
- takeScreenshot: 01_train
- tapOn: "Log"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02_log
- tapOn: "Progress"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03_progress
- tapOn: "Profile"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04_profile
