# Obytes starter showcase, ANDROID. shotfleet 0.1.6 released binary, Maestro 2.0.10. ONE private emulator, shotfleet's own AVD shotfleet_android.
# ANDROID_HOME=/Users/manu/Library/Android/sdk must be set. Release APK (arm64-v8a only, template debug keystore), paths config-relative.
#   dry run:  shotfleet run shotfleet.android.toml --platform android --locales en --parallel 1
#   counted:  shotfleet run shotfleet.android.toml --platform android --locales en,ar --parallel 1
[android]
apk = "app/app-release.apk"
package = "com.obytes.development"
strings = "src/src/translations/*.json"
flow = "flow.android.yaml"
avd = "shotfleet_android"
parallel = 1
out = "out-android"
locales = ["en", "ar"]
