# Kuokka showcase, Android (dry-run version 1, 2026-10-08). English only; shotfleet translates every selector per language.
# Build: debug APK 2.0.15 (114) from origin/main eba7746e. Fresh install, no account, NO STORY IS EVER OPENED, nothing is typed.
# Screens without live Hacker News content: 05_search (empty initial state, optional), 01_radar (empty state), 02_bookmarks (empty state),
# 03_account (signed out), 04_settings. The Home feed is live HN (titles, usernames, favicons): it is passed through and never shot.
# The analytics dialog is DECLINED ("Not now"): nothing is sent to the owner's Firebase project. Onboarding is skipped ("Skip"): no intent, no starter Radar rule.
appId: me.manulorenzo.hackernewskmp
name: "Kuokka showcase, Android"
---
- launchApp:
    clearState: true
    permissions:
      all: allow
# 1. Analytics consent dialog ("Help improve Kuokka") sits on top of onboarding on a fresh install: decline it.
- extendedWaitUntil:
    visible: "Not now"
    timeout: 60000
    optional: true
- tapOn:
    text: "Not now"
    optional: true
# 2. Onboarding -> Skip
- extendedWaitUntil:
    visible: "Skip"
    timeout: 60000
- tapOn: "Skip"
# 3. Home (live feed): wait for the bottom bar, shoot nothing here.
- extendedWaitUntil:
    visible: "Radar"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 8000
# Search: empty initial state (optional frame)
- tapOn: "Search"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 05_search
# Radar: empty state with the preset chips
- tapOn: "Radar"
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 01_radar
# Bookmarks: empty on a fresh install
- tapOn: "Bookmarks"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 02_bookmarks
# Account: signed out
- tapOn: "Account"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 03_account
# Settings: gear icon in the Account top bar (content description "Settings")
- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 04_settings
