<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../public/site.css">
<style>
 html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#f4f6f8}
 .og{position:relative;width:1200px;height:630px;display:grid;grid-template-columns:560px 1fr;padding:64px 0 0 72px;box-sizing:border-box}
 .og h1{font-size:68px;line-height:1;letter-spacing:-0.045em;max-width:520px;margin-top:26px}
 .og .brand{font-size:30px}.og .brand svg{width:32px;height:32px}
 .og p{margin-top:26px;font-size:25px;line-height:1.35;color:#55657a;max-width:470px}
 .og p b{color:#0d1b2a}
 .row{position:absolute;left:624px;top:44px;display:flex;gap:18px}
 .s{display:grid;gap:12px;width:170px}.s:nth-child(even){margin-top:56px}
 .s img{width:170px;border-radius:22px;border:1px solid #d5dce4;box-shadow:0 12px 32px rgba(13,27,42,.18)}
 .flag{font-size:22px;height:38px}

<div class="og"><div>
  <span class="brand"><svg viewBox="0 0 24 24"><path d="M3 4h18l-4.5 8L21 20H3z" fill="#1e48c9"/></svg>shotfleet</span>

  <p>One Maestro flow. Every language, <b>checked</b>.</p>
</div>
<div class="row">
  <div class="s"><span class="flag r">ja</span><img src="../public/img/train_ja.jpg"></div>
  <div class="s"><span class="flag y">ar</span><img src="../public/img/train_ar.jpg"></div>
  <div class="s"><span class="flag b">ko</span><img src="../public/img/train_ko.jpg"></div>
</div></div></body></html>
